name: Buscar departamentos

on:
  schedule:
    # Chequeo rápido cada 15 minutos (GitHub puede demorarlo unos minutos).
    - cron: "*/15 * * * *"
    # Recorrida completa una vez por día, 7:00 de Buenos Aires.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Recorrer todos los listados"
        type: boolean
        default: false

concurrency:
  group: buscar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 10 * * *" ] || [ "${{ inputs.full }}" = "true" ]; then
            python -m finder.run --full
          else
            python -m finder.run
          fi
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "finder-bot"
          git config user.email "finder-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Actualizar estado" && git push
